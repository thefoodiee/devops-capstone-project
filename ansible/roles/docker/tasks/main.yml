---
- name: Install required system packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Ensure Docker service is installed and started
  service:
    name: docker
    state: started
    enabled: yes
  ignore_errors: yes
