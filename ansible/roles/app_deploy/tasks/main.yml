---
- name: Copy Kubernetes manifests to target host
  copy:
    src: ../../../k8s/
    dest: "{{ app_dir }}/k8s/"
    mode: '0644'

- name: Create Kubernetes namespace
  command: kubectl apply -f "{{ app_dir }}/k8s/namespace.yaml"
  ignore_errors: yes

- name: Deploy PostgreSQL and Storage
  command: kubectl apply -f "{{ app_dir }}/k8s/pvc.yaml" -f "{{ app_dir }}/k8s/secret.yaml" -f "{{ app_dir }}/k8s/configmap.yaml" -f "{{ app_dir }}/k8s/postgres-deployment.yaml"
  ignore_errors: yes

- name: Deploy Notes Application and Ingress
  command: kubectl apply -f "{{ app_dir }}/k8s/rbac.yaml" -f "{{ app_dir }}/k8s/notes-deployment.yaml" -f "{{ app_dir }}/k8s/hpa.yaml" -f "{{ app_dir }}/k8s/ingress.yaml"
  ignore_errors: yes
