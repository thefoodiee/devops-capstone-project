---
- name: Ensure target application deployment directory exists
  file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'

- name: Deploy application environment configuration
  copy:
    dest: "{{ app_dir }}/.env"
    content: |
      SECRET_KEY=ansible-generated-secret-key-2024
      DB_HOST=notes-postgres-service
      DB_PORT=5432
      DB_NAME=notes_db
      APP_ENV=production
      LOG_LEVEL=INFO
    mode: '0600'
