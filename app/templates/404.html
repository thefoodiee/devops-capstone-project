{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <div class="display-1 text-primary fw-bold mb-3">404</div>
                <h3 class="fw-bold mb-2">Page Not Found</h3>
                <p class="text-muted mb-4">The note or resource you are looking for doesn't exist or has been removed.</p>
                <div>
                    <a href="{{ url_for('web.dashboard') if session.get('user_id') else url_for('web.login_view') }}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-house-door-fill me-1"></i> Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
