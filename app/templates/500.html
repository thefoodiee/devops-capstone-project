{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <div class="display-1 text-danger fw-bold mb-3">500</div>
                <h3 class="fw-bold mb-2">Internal Server Error</h3>
                <p class="text-muted mb-4">Something went wrong on our end. Please try again shortly.</p>
                <div>
                    <a href="{{ url_for('web.dashboard') if session.get('user_id') else url_for('web.login_view') }}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-arrow-clockwise me-1"></i> Return to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
