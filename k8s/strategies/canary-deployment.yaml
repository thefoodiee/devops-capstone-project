apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app-stable
  namespace: notes-app
  labels:
    app: notes-canary-demo
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: notes-canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: notes-canary-demo
        track: stable
    spec:
      containers:
        - name: notes-app
          image: notes-app:1.0.0
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app-canary
  namespace: notes-app
  labels:
    app: notes-canary-demo
    track: canary
spec:
  replicas: 1  # 1 replica out of 10 = 10% traffic to Canary
  selector:
    matchLabels:
      app: notes-canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: notes-canary-demo
        track: canary
    spec:
      containers:
        - name: notes-app
          image: notes-app:2.0.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: notes-canary-service
  namespace: notes-app
spec:
  selector:
    app: notes-canary-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
