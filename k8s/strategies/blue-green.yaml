apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app-blue
  namespace: notes-app
  labels:
    app: notes-app
    slot: blue
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
      slot: blue
  template:
    metadata:
      labels:
        app: notes-app
        slot: blue
        version: v1.0.0
    spec:
      containers:
        - name: notes-app
          image: notes-app:1.0.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "1.0.0-blue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app-green
  namespace: notes-app
  labels:
    app: notes-app
    slot: green
    version: v2.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
      slot: green
  template:
    metadata:
      labels:
        app: notes-app
        slot: green
        version: v2.0.0
    spec:
      containers:
        - name: notes-app
          image: notes-app:2.0.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "2.0.0-green"
---
apiVersion: v1
kind: Service
metadata:
  name: notes-live-service
  namespace: notes-app
spec:
  selector:
    app: notes-app
    slot: blue   # Traffic currently pointed to Blue. Switch to 'green' for zero-downtime release.
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
