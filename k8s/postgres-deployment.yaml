apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-postgres
  namespace: notes-app
  labels:
    app: notes-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-postgres
  template:
    metadata:
      labels:
        app: notes-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: notes-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: DB_NAME
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "notes_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "notes_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: notes-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: notes-postgres-service
  namespace: notes-app
spec:
  selector:
    app: notes-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
