# Fluentd Centralized Logging Configuration
# Collects container and application JSON logs

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter notes.**>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</filter>

<match notes.**>
  @type stdout
</match>

<match **>
  @type stdout
</match>
