# SonarQube Project Configuration
# Capstone Project: Cloud-Native Notes Application

sonar.projectKey=cloud-notes-app
sonar.projectName=Cloud-Native Notes Application
sonar.projectVersion=1.0.0

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.11,3.12,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.bandit.reportPaths=bandit-report.json

# Exclusions
sonar.exclusions=**/static/**,**/templates/**,**/__pycache__/**,venv/**,env/**
